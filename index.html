<!doctype html>
<html lang="es">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Horror Mansion 3D - Babylon.js</title>
  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: 'Courier New', monospace;
      background: #000;
    }

    #renderCanvas {
      width: 100%;
      height: 100%;
      touch-action: none;
      display: block;
    }

    .overlay {
      position: absolute;
      left: 20px;
      top: 20px;
      z-index: 10;
      color: #ff4444;
      text-shadow: 0 0 10px rgba(255, 68, 68, 0.5);
      pointer-events: none;
    }

    .overlay h1 {
      margin: 0;
      font-size: 24px;
      font-weight: bold;
      letter-spacing: 2px;
    }

    .overlay p {
      margin: 5px 0;
      font-size: 12px;
      opacity: 0.8;
    }

    .controls {
      position: absolute;
      right: 20px;
      top: 20px;
      z-index: 10;
      color: #fff;
      background: rgba(0, 0, 0, 0.7);
      padding: 15px;
      border-radius: 5px;
      font-size: 12px;
      border: 1px solid #ff4444;
      pointer-events: none;
    }

    .controls h3 {
      margin: 0 0 10px 0;
      color: #ff4444;
      font-size: 14px;
    }

    .controls ul {
      margin: 0;
      padding: 0 0 0 20px;
      list-style: none;
    }

    .controls li {
      margin: 3px 0;
    }

    .controls li::before {
      content: "▸ ";
      color: #ff4444;
    }

    #loadingScreen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #000;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 100;
      color: #ff4444;
    }

    #loadingScreen h2 {
      margin-bottom: 20px;
      font-size: 32px;
      letter-spacing: 3px;
    }

    .loader {
      width: 50px;
      height: 50px;
      border: 5px solid #333;
      border-top-color: #ff4444;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    #loadingScreen.hidden {
      display: none;
    }
  </style>
</head>

<body>
  <div id="loadingScreen">
    <h2>HORROR MANSION 3D</h2>
    <div class="loader"></div>
    <p style="margin-top: 20px; font-size: 14px;">Cargando modelos y texturas...</p>
  </div>

  <div class="overlay">
    <h1>🎃 HORROR MANSION</h1>
  </div>

  <div class="controls">
    <h3>CONTROLES</h3>
    <ul>
      <li>↑ ↓ Mover</li>
      <li>← → Rotar</li>
      <li>Shift + ↑↓ Correr</li>
      <li>Espacio - Ataque</li>
      <li>L - Linterna</li>
      <li>C - Modo creador</li>
      <li>Código Konami: ↑↓↑↓←→←→BA</li>
    </ul>
  </div> <canvas id="renderCanvas"></canvas>

  <!-- Entrada modular (Vite + TypeScript) -->
  <script type="module" src="/src/main.ts"></script>

  <script>
    // Ocultar pantalla de carga cuando todo esté listo
    window.addEventListener('load', () => {
      setTimeout(() => {
        const loadingScreen = document.getElementById('loadingScreen');
        loadingScreen.classList.add('hidden');
      }, 2000);
    });
  </script>
</body>

</html>
